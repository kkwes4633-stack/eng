  --soft:#E1F7EF; --pri:#0E7C66; --pri-d:#0A6552; --ok:#0E9F6E; --bad:#E05252; --warn:#E8890C;
  --acc:#FFC145; --head1:#2FD1A8; --head2:#0E9F6E; --okbg:#DCF6E8; --badbg:#FFE6E6;
  --okink:#0A6B48; --badink:#B02A2A; --bar:#DCEFE7;
  --rad:24px; --rad2:26px; --shadow:0 3px 14px rgba(14,124,102,.09);
  --tint-ok:#DCF6E8; --tint-bad:#FFE6E6; --tint-warn:#FFF3D6; --tint-neutral:#E4F2EC;
}
body[data-theme="night"]{
  --bg:#0F151C; --card:#18212B; --ink:#E8EFF5; --muted:#93A6B8; --line:#2A3644;
  --soft:#1F2C38; --pri:#4CA6FF; --pri-d:#2E86E0; --ok:#34D399; --bad:#FF7A7A; --warn:#FBBF24;
  --acc:#FBBF24; --head1:#14263A; --head2:#1D3E5C; --okbg:#123329; --badbg:#3A1D1D;
  --okink:#7BE3B4; --badink:#FFA5A5; --bar:#273444;
  --rad:16px; --rad2:18px; --shadow:0 1px 0 rgba(255,255,255,.05);
  --tint-ok:#123329; --tint-bad:#3A1D1D; --tint-warn:#332811; --tint-neutral:#1C2733;
}
body[data-theme="mint"]{font-size:17px;line-height:1.58}
body[data-theme="night"] .saybtn,body[data-theme="night"] .recbtn{box-shadow:0 4px 16px rgba(76,166,255,.35)}
body[data-theme="mint"] .card h3{font-size:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:24px;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}

/* 顶部 */
header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:14px 0 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:9px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.brand small{font-weight:400;opacity:.85;font-size:12px}
.kids{display:flex;gap:6px;background:rgba(255,255,255,.18);padding:4px;border-radius:12px}
.kid{padding:7px 15px;border-radius:9px;font-size:14px;font-weight:600;color:#fff;border:0;background:transparent;cursor:pointer}
.kid.on{background:var(--card);color:var(--pri)}
.meta{display:flex;gap:14px;font-size:12.5px;opacity:.92;margin-top:8px;flex-wrap:wrap}
.meta b{font-size:15px}

/* 标签栏 */
nav{position:sticky;top:0;z-index:19;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
nav .tabs{display:flex;max-width:1000px;margin:0 auto;padding:0 8px;gap:2px}
.tab{flex:0 0 auto;padding:12px 16px;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
@media(max-width:520px){.tab{padding:11px 8px;font-size:13px}.brand small{display:none}}

/* 卡片 */
.card{background:var(--card);border-radius:var(--rad);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);display:inline-block}
.sub{color:var(--muted);font-size:13px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--card);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:var(--soft);border-color:transparent;color:var(--pri)}
.btn.wide{width:100%}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45}
.sm{min-height:38px;font-size:14px;padding:0 14px;border-radius:10px}

/* 今日 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.stat{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;color:var(--pri);line-height:1.1}
.stat .l{font-size:12px;line-height:1.35;color:var(--muted);margin-top:4px;word-break:break-word}
.taskline{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.taskline:last-child{border-bottom:0}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--pri);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bar) 0);display:grid;place-items:center;flex:0 0 auto}
.ring i{width:42px;height:42px;background:var(--card);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:700;color:var(--pri)}


/* ===== 融合版「今日·看板」===== */
.hero{padding:0;overflow:hidden;border:1px solid var(--line)}
.heroTop{position:relative;background:linear-gradient(135deg,var(--head1),var(--head2));padding:16px 16px 18px;color:#fff}
.heroTop:after{content:"";position:absolute;inset:0;background:radial-gradient(130% 90% at 100% 0,rgba(255,255,255,.4),rgba(255,255,255,0) 62%);pointer-events:none}
.heroIn{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.heroDate{font-size:12.5px;opacity:.92}
.heroName{font-size:19px;font-weight:800;margin-top:1px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.heroTip{font-size:13px;opacity:.96;margin-top:5px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.24)}
.chip.on{background:rgba(255,255,255,.92);color:var(--pri)}
.ring2{--p:0;width:88px;height:88px;flex:0 0 auto;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.3) 0);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.6) inset}
.ring2 i{width:68px;height:68px;border-radius:50%;background:var(--card);color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.08) inset}
.heroBot{padding:12px 16px 15px;background:linear-gradient(180deg,var(--card),var(--soft))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:4px}
.stat{border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--soft));box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 12px -10px rgba(20,30,40,.5)}
details.more{background:var(--card);border-radius:var(--rad);padding:2px 16px 4px;margin-top:14px;box-shadow:var(--shadow)}
details.more summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:14px;color:var(--pri);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open]{padding-bottom:14px}
details.more .body{border-top:1px solid var(--line);padding-top:12px}

/* 单词卡 */
.qbox{background:var(--card);border-radius:var(--rad2);padding:22px 18px;margin-top:14px;box-shadow:0 2px 10px rgba(27,39,51,.08)}
.word{font-size:38px;font-weight:800;letter-spacing:.5px;color:var(--pri);text-align:center;word-break:break-word}
.ipa{text-align:center;color:var(--muted);font-size:15px;margin-top:2px}
.saybtn{display:block;margin:14px auto 0;width:64px;height:64px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(15,111,184,.3)}
.saybtn:active{transform:scale(.94)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;padding:8px 16px;text-align:left;font-family:inherit}
.opt:active{background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.5}
.inp{width:100%;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font-size:19px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,111,184,.12)}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14.5px;line-height:1.6}
.fb.ok{background:var(--okbg);color:var(--okink)}
.fb.bad{background:var(--badbg);color:var(--badink)}
.fb .eg{display:block;margin-top:6px;color:var(--muted);font-size:13.5px}
.bar{height:6px;background:var(--bar);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#0F6FB8,#0E9F6E);width:0;transition:width .25s}

/* 录音 */
.recwrap{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.recbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:700;cursor:pointer;flex:0 0 auto}
.recbtn.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,47,47,.5)}70%{box-shadow:0 0 0 16px rgba(220,47,47,0)}100%{box-shadow:0 0 0 0 rgba(220,47,47,0)}}
.timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.item:last-child{border-bottom:0}
.item .when{color:var(--muted);flex:0 0 auto}
.stars{color:#C9D4DE;font-size:17px;letter-spacing:1px;cursor:pointer}
.stars b{color:var(--acc);font-weight:400}

/* 文本 */
.read{font-size:18px;line-height:1.95;color:#22303D}
.read p{margin:0 0 12px}
.hl{background:var(--tint-warn);border-radius:4px;padding:0 2px}
.tok{font-size:15px;display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:6px;background:var(--tint-neutral);color:var(--muted)}
.tok.g{background:var(--okbg);color:var(--ok)}
.tok.r{background:var(--badbg);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(27,39,51,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:86vw}
.toast.on{opacity:1;bottom:34px}
.empty{text-align:center;color:var(--muted);padding:34px 0;font-size:14px}
h4.sc{margin:18px 0 8px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.qtag{display:inline-block;font-size:12px;background:var(--soft);color:var(--pri);padding:4px 10px;border-radius:8px;font-weight:700}
.scopes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.sp{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:inherit;white-space:nowrap}
.sp.on{background:var(--pri);border-color:var(--pri);color:#fff}
.src{margin-top:10px;font-size:12px;color:#9AA7B4;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .h{text-align:center;font-size:11px;color:#94A3B2}
.cal .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;background:var(--soft);color:var(--muted)}
.cal .c.on{background:var(--ok);color:#fff;font-weight:700}
.cal .c.part{background:var(--tint-warn);color:#8A5A00;font-weight:600}
.cal .c.xx{background:var(--tint-bad);color:#B4453F}
.cal .c.today{outline:3px solid var(--pri);outline-offset:-3px}
.cal .c.blank{background:transparent}
.themeopt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;color:var(--ink)}
.themeopt.on{border-color:var(--pri)}
.sw{display:flex;gap:4px;flex:0 0 auto}.sw i{display:block;width:14px;height:26px;border-radius:5px}
.themebtn{border:0;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.medals .m{text-align:center;padding:10px 6px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:12px;line-height:1.5}
.medals .m.got{background:var(--tint-ok);color:var(--ok);font-weight:700}
.medals .m b{display:block;font-size:15px;margin-bottom:2px}
/* 隐藏托管层注入的「豆包AI生成」角标 */
[data-custom-element^="doubao-watermark"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}

/* ==================== 工具 ==================== */
function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function today(){ return todayStr(); }
function cur(){ return DB[S.child]; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1900); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* 艾宾浩斯：答对后隔 1→2→4→7→15→30→60 天再出现；7 轮全过才算记住 */
const GAPS=[1,2,4,7,15,30,60];
const MASTER_R=7;
function recOf(w){ return cur().rec[w] || null; }
function nextDue(rec){
  if(!rec||!rec.last) return null;
  if(rec.r>=MASTER_R) return null;          // 七轮全过，退出队列
  const gap = GAPS[Math.min(rec.r,GAPS.length-1)];
  return addDays(rec.last, gap);
}
function isMastered(w){ const r=recOf(w); return !!(r && r.r>=MASTER_R); }
function isNew(w){ const r=recOf(w); return !r || !r.last; }
function dueWords(){
  const t=today();
  return WORDS.filter(x=>matchScope(x)).filter(x=>{
    const r=recOf(x.w); if(!r||!r.last) return false;
    if(r.r>=MASTER_R) return false;
    return nextDue(r) <= t;
  });
}
function newWords(target){
  const learned = sessionOf(today()).n || 0;
  const left = Math.max(0, (target||0) - learned);
  return WORDS.filter(x=>isNew(x.w) && matchScope(x)).slice(0, left);
}
function scopesOf(){
  const set=[]; WORDS.forEach(x=>{ const k=x.s.split("-")[0]; if(set.indexOf(k)<0) set.push(k); });
  const ord=["三上","三下","四上(新)","四下(新)","五上(新)","五下(新)","六上","六下"];
  return set.sort((x,y)=>{ const a=ord.indexOf(x), b=ord.indexOf(y); return (a<0?99:a)-(b<0?99:b); });
}
function matchScope(x){ return S.scope==="all" || x.s.indexOf(S.scope)===0; }
function sessionOf(date, c){
  c=c||S.child; const s=DB[c].sess[date];
  return s || {n:0,r:0,ok:0,bad:0,sp:0,rd:0,wr:0,done:false};
}
function patchSession(date, c, patch){
  c=c||S.child;
  const s = Object.assign(sessionOf(date,c), patch);
  if(patch && typeof patch.delta==="object"){
    Object.keys(patch.delta).forEach(k=>{ s[k]=(s[k]||0)+patch.delta[k]; });
    delete s.delta;
  }
  DB[c].sess[date]=s; save(); return s;
}
function bump(field, n){ patchSession(today(), S.child, {delta:{[field]: n||1}}); }

/* ==================== 语音合成 ==================== */
let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  if(!VOICES.length){ loadVoices(); }
  const en = VOICES.filter(v=>/^en[-_]?(US|GB|AU|IN)?/i.test(v.lang||""));
  return en.find(v=>/Samantha|Karen|Moira|Alex|Google US English|Microsoft (.*)English/i.test(v.name)) || en[0] || null;
}
/* 朗读：慢速默认开（孩子更容易听清）；找不到英语语音包时提醒一次 */
function say(text, rate){
  if(!text) return;
  if(!window.speechSynthesis){ toast("这台设备不支持朗读，可先用点读笔或手机"); return; }
  try{
    speechSynthesis.cancel();
    const base=(typeof rate==="number"?rate:0.92);
    const v=pickVoice();
    if(!v && !S._voiceWarn){ S._voiceWarn=1; toast("这台设备没装英语语音，声音会有点怪：手机设置里装一个 English (US) 语音包就清楚了"); }
    /* 长句按逗号断开，一句一句念，孩子更容易跟上 */
    const parts=(S.slow && text.length>34 && text.indexOf(", ")>0) ? text.split(", ") : [text];
    parts.forEach(part=>{
      const u=new SpeechSynthesisUtterance(part);
      u.lang="en-US"; u.pitch=1; u.volume=1;
      u.rate=Math.max(0.45, base * (S.slow?0.82:1));
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    });
  }catch(e){ toast("朗读失败，请检查设备音量"); }
}

/* ==================== 录音 ==================== */
let MR=null, CHUNKS=[], STREAM=null, REC_T0=0, REC_TIMER=null;
let CUR_REC_CTX=null;
async function startRec(ctx){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    toast("当前浏览器不支持录音，请用 Safari / Chrome 打开"); return;
  }
  try{
    STREAM = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    toast("没有麦克风权限。请在浏览器地址栏左侧允许麦克风后重试"); return;
  }
  CHUNKS=[]; CUR_REC_CTX=ctx||{};
  const mime = MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
  MR = mime ? new MediaRecorder(STREAM,{mimeType:mime}) : new MediaRecorder(STREAM);
  MR.ondataavailable = e=>{ if(e.data && e.data.size) CHUNKS.push(e.data); };
  MR.onstop = onRecStop;
  if(ctx && ctx.asr) srStart();
  MR.start();
  REC_T0=Date.now();
  render(); // 更新按钮状态
  REC_TIMER=setInterval(()=>{
    const el=document.getElementById("recTimer");
    if(el) el.textContent=fmtSec(Math.floor((Date.now()-REC_T0)/1000));
  },500);
}
/* 语音识别：只在支持的浏览器里用来判“背得对不对”，不支持就退回“时长够不够” */
let SR_ON=false, SR_OBJ=null, SR_TEXT="";
function srSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function srStart(){
  SR_TEXT=""; SR_ON=false;
  if(!srSupported()) return;
  try{
    const Ctor=window.SpeechRecognition||window.webkitSpeechRecognition;
    SR_OBJ=new Ctor(); SR_OBJ.lang="en-US"; SR_OBJ.continuous=true; SR_OBJ.interimResults=true;
    SR_OBJ.onresult=e=>{
      let t="";
      for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript+" ";
      SR_TEXT=t.toLowerCase().replace(/[^a-z' ]/g," ");
    };
    SR_OBJ.onerror=()=>{};
    SR_OBJ.start(); SR_ON=true;
  }catch(e){ SR_ON=false; }
}
function srStop(){
  try{ if(SR_OBJ) SR_OBJ.stop(); }catch(e){}
  SR_ON=false;
  const t=SR_TEXT||"";
  if(!t) return null;
  return t;
}
/* 目标句里有多少词被识别到（0~1） */
function hitRate(target, said){
  if(!said) return null;
  const tw=target.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
  const sw=said.split(/\s+/).filter(Boolean);
  if(!tw.length) return null;
  let hit=0;
  tw.forEach(w=>{ if(sw.some(x=>x===w || x.indexOf(w)===0)) hit++; });
  return hit/tw.length;
}
function fmtSec(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
async function stopRec(){
  if(!MR) return;
  try{ MR.stop(); }catch(e){}
  clearInterval(REC_TIMER);
  if(STREAM){ STREAM.getTracks().forEach(t=>t.stop()); STREAM=null; }
}
async function onRecStop(){
  MR=null;
  if(!CHUNKS.length){ toast("没有录到声音，再试一次"); return; }
  const blob=new Blob(CHUNKS,{type:CHUNKS[0].type||"audio/webm"});
  const sec=Math.round((Date.now()-REC_T0)/1000);
  const rec={ child:S.child, date:today(), sec, module:(CUR_REC_CTX&&CUR_REC_CTX.module)||"speak",
              note:(CUR_REC_CTX&&CUR_REC_CTX.note)||"", stars:0, blob };
  try{ await addRec(rec); }catch(e){ toast("录音保存失败（存储空间可能已满）"); return; }
  let srScore=null;
  if(SR_ON){ srScore=srStop(); }
  if(CUR_REC_CTX && typeof CUR_REC_CTX.onDone==="function"){
    try{ CUR_REC_CTX.onDone(sec, srScore); }catch(e){}
  }
  if(rec.module==="speak") bump("sp");
  else if(rec.module==="retell") bump("rt");
  else if(rec.module==="topic") bump("tp");
  else bump("rd");
  toast("已保存，录音 "+sec+" 秒");
  render();
}

/* IndexedDB */
let IDBP=null;
function idb(){
  if(IDBP) return IDBP;
  IDBP=new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open("eng_workbench_audio",1); }catch(e){ rej(e); return; }
    r.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains("rec")) db.createObjectStore("rec",{keyPath:"id",autoIncrement:true}); };
    r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e);
  });
  return IDBP;
}
function addRec(o){ return idb().then(db=>new Promise((res,rej)=>{ const st=db.transaction("rec","readwrite").objectStore("rec").add(o); st.onsuccess=e=>res(e.target.result); st.onerror=e=>rej(e); })); }
function listRec(child, date){ return idb().then(db=>new Promise((res,rej)=>{ const st=db.transaction("rec","readonly").objectStore("rec").getAll(); st.onsuccess=e=>{ let a=e.target.result.filter(x=>x.child===child); if(date) a=a.filter(x=>x.date===date); res(a.reverse()); }; st.onerror=e=>rej(e); })); }
function delRec(id){ return idb().then(db=>new Promise((res,rej)=>{ const st=db.transaction("rec","readwrite").objectStore("rec").delete(id); st.onsuccess=()=>res(); st.onerror=e=>rej(e); })); }
function setStars(id, n){ return idb().then(db=>new Promise((res,rej)=>{ const s=db.transaction("rec","readwrite").objectStore("rec"); const g=s.get(id); g.onsuccess=e=>{ const o=e.target.result; o.stars=n; s.put(o).onsuccess=()=>res(); }; g.onerror=e=>rej(e); })); }

function buildQueue(){
  const C=CFG[S.child];
  const due = dueWords();
  const fresh = newWords(C.newN);
  const items = [];
  fresh.forEach(w=>items.push({w, isNew:true}));
  shuffle(due).slice(0,30).forEach(w=>items.push({w, isNew:false}));
  if(!items.length){
    // 没有到期词、今天新词也学完了 → 用今天学过的词做巩固轮（不快进进度）
    const tw = WORDS.filter(x=>matchScope(x)).filter(x=>{ const r=recOf(x.w); return r && r.last===today(); });
    shuffle(tw).slice(0,15).forEach(w=>items.push({w, isNew:false, drill:true}));
  }
  return items;
}

function answer(val){

  const w=Q.cur;

/* 记录一次答题：更新排程 + 今日明细 */
function whyOf(type){ return type==="spell" ? "拼写" : (type==="audio" ? "听音" : "词义"); }
function whyStats(){
  const acc={"拼写":0,"听音":0,"词义":0};
  WORDS.forEach(x=>{
    const r=recOf(x.w); if(!r||!r.why) return;
    Object.keys(r.why).forEach(k=>{ if(acc[k]!==undefined) acc[k]+=r.why[k]; });
  });
  return acc;
}
function drillWhy(cat){
  const pool = WORDS.filter(x=>{ const r=recOf(x.w); return r && r.why && r.why[cat]>0; })
    .sort((a,b)=>{ const ra=recOf(a.w), rb=recOf(b.w); return rb.why[cat]-ra.why[cat]; }).slice(0,15);
  if(!pool.length){ toast("这一类还没有错题"); return; }
  Q={list:pool.map(w=>({w,isNew:false,drill:true})), i:0, cur:null, type:"", phase:"q", answered:false, stat:{ok:0,bad:0}};
  nextQ();
}
function markAnswer(w, right, type, drill){
  if(!drill){
    const c=cur();
    let r=c.rec[w.w];
    if(!r){ r={r:0,l:"",last:"",w:0,lw:0,first:today()}; c.rec[w.w]=r; }
    const wasNew = !r.last;
    r.w = r.w||0;
    if(right){ r.r=(r.r||0)+1; r.last=today(); r.lw=0; }
    else {
      r.r=0; r.last=today(); r.w+=1; r.l="bad";
      r.why = r.why || {};
      const k = whyOf(type||"");
      r.why[k] = (r.why[k]||0)+1;
    }
    save();
    if(wasNew) bump("n"); else bump("r");
  } else {
    bump("r");
  }
  if(right) bump("ok"); else bump("bad");
}

function recOfC(c,w){ return DB[c].rec[w]||null; }
function statsOf(c){
  const D=DB[c]||{}, sess=D.sess||{};
  let days=0, done=0, n=0, r=0, ok=0, bad=0, sp=0, rd=0, wr=0, tp=0, rt=0, scr=0;
  Object.keys(sess).forEach(d=>{
    const s=sess[d]||{};
    if(s.done) done++;
    if(s.done || s.n||s.r||s.ok||s.bad||s.sp||s.rd||s.wr||s.tp||s.rt||s.scr) days++;
    n+=s.n||0; r+=s.r||0; ok+=s.ok||0; bad+=s.bad||0; sp+=s.sp||0;
    rd+=s.rd||0; wr+=s.wr||0; tp+=s.tp||0; rt+=s.rt||0; scr+=s.scr||0;
  });
  const words=WORDS;
  const mastered=words.filter(x=>{ const r0=recOfC(c,x.w); return r0 && r0.r>=MASTER_R; }).length;
  const touched=words.filter(x=>{ const r0=recOfC(c,x.w); return r0 && r0.last; }).length;
  const wrong=words.filter(x=>{ const r0=recOfC(c,x.w); return r0 && r0.l==="bad"; }).length;
  const bestRate = (ok+bad)>0 ? Math.round(ok*100/(ok+bad)) : 0;
  let best=0, run=0, t=today();
  const first=Object.keys(sess).sort()[0];
  if(first){
    for(let d=first; d<=t; d=addDays(d,1)){
      if(sess[d] && sess[d].done){ run++; if(run>best) best=run; } else run=0;
    }
  }
  return {days, done, n, r, ok, bad, sp, rd, wr, tp, rt, scr, mastered, touched, wrong, bestRate, best,
          total:words.length, left:words.length-touched, planMin:planMinutes(c)};
}
const BADGES=[
 {t:"第一次打卡", d:"点一次打卡", f:s=>s.done>=1},
 {t:"连续 3 天",  d:"三天不断",   f:s=>s.best>=3},
 {t:"七天不断",   d:"连续一周",   f:s=>s.best>=7},
 {t:"三周不断",   d:"连续 21 天", f:s=>s.best>=21},

 {t:"认识 300 词",d:"见过的词",   f:s=>s.touched>=300},
 {t:"掌握 50 词", d:"能自己想起来", f:s=>s.mastered>=50},
 {t:"掌握 150 词",d:"能自己想起来", f:s=>s.mastered>=150},

 {t:"话题 10 个", d:"话题卡录音", f:s=>s.tp>=10}
];
function monthCells(c, mo){
  const base=new Date();
  const y=base.getFullYear(), m=base.getMonth()+mo;
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const pad=(first.getDay()+6)%7;   // 周一为第一列
  const cellDate=i=>todayStr(new Date(y,m,i));
  const sess=DB[c].sess||{}, plan=DB[c].plan||{};
  let on=0, part=0;
  let html="";
  ["一","二","三","四","五","六","日"].forEach(h=>html+=`<div class="h">${h}</div>`);
  for(let i=0;i<pad;i++) html+=`<div class="c blank"></div>`;
  for(let i=1;i<=days;i++){
    const d=cellDate(i), s=sess[d], p=plan[d]||{};
    const hasPlan=Object.keys(p).some(k=>p[k]);
    const hasSess=!!(s && (s.n||s.r||s.ok||s.bad||s.sp||s.rd||s.wr||s.tp||s.rt));
    let cls="c";
    if(s && s.done){ cls+=" on"; on++; }
    else if(hasSess || hasPlan){ cls+=" part"; part++; }
    else if(d>today()) cls+=" blank";
    else if(hasSess===false && (s && (s.bad||0)>0)) cls+=" xx";
    if(d===today()) cls+=" today";
    html+=`<div class="${cls}" title="${d}">${i}</div>`;
  }
  return {html, on, part, y:y+(m>11?1:0), m:((m%12)+12)%12+1};
}

function render(){
  renderTop();
  const v=document.getElementById("view");
  if(S.view==="today"||S.view==="board") v.innerHTML=vHome();
  else if(S.view==="rw") v.innerHTML=vRW();
  else if(S.view==="screen") v.innerHTML=vScreen();
  else if(S.view==="word") v.innerHTML=vWord();
  else if(S.view==="listen") v.innerHTML=vListen();
  else if(S.view==="speak") v.innerHTML=vSpeak();
  else if(S.view==="read") v.innerHTML=vRead();
  else if(S.view==="write") v.innerHTML=vWrite();
  else if(S.view==="plan") v.innerHTML=vNCE();
  else if(S.view==="road") v.innerHTML=vPlan();
  // 录音列表
  if(S.view==="speak") paintRecList(["speak","retell","topic"]);
  if(S.view==="read") paintRecList("read");

  // 输入框回车
  const sp=document.getElementById("spell");
  if(sp){ sp.focus(); sp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checkSpell(); } }); }
  const sp2=document.getElementById("spell2");
  if(sp2){ sp2.focus(); sp2.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checkWrite(); } }); }
  const imp=document.getElementById("impFile");
  if(imp){
    imp.addEventListener("change", (ev)=>{
      const f=ev.target.files && ev.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ restoreFromText(String(rd.result||"")); };
      rd.readAsText(f);
    });
  }
  if(MR && !document.getElementById("recTimer")) {} // 保持
}

/* ==================== 事件 ==================== */
document.addEventListener("click", async (e)=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;

  if(act==="kid"){
    if(MR){ toast("先停止录音再切换"); return; }
    S.child=el.dataset.k; S.scope="all"; Q={list:[],i:0,cur:null,type:"",phase:"q",answered:false,stat:{ok:0,bad:0}};
    LQ={list:[],i:0,cur:null,phase:"q"}; WQ={list:[],i:0,cur:null,phase:"q"}; RQ={idx:0};
    render(); return;
  }
  if(act==="view" || act==="go"){
    S.view = el.dataset.v;
    render(); return;
  }
  if(act==="scope"){
    S.scope=el.dataset.s;
    Q={list:[],i:0,cur:null,type:"",phase:"q",answered:false,stat:{ok:0,bad:0}};
    render(); return;
  }
  if(act==="say"){ say(el.dataset.t, 0.88); return; }
  if(act==="say-slow"){ say(el.dataset.t, 0.6); return; }
  if(act==="say-fast"){ say(el.dataset.t, 1.0); return; }
  if(act==="slow-toggle"){ S.slow=!S.slow; render(); toast(S.slow?"慢速朗读已开":"已恢复常速"); return; }
  if(act==="read-say"){
    const t=TEXTS[S.child][RQ.idx%TEXTS[S.child].length];
    say(t.p.join(" "), 0.9); return;
  }
  if(act==="read-next"){ RQ.idx=(RQ.idx+1)%TEXTS[S.child].length; render(); return; }
  if(act==="retell-play"){ say(TEXTS[S.child][0].p.slice(0,3).join(" "), 0.9); return; }
  if(act==="retell-hide"){ S.hideText=!S.hideText; render(); return; }

  if(act==="mo"){ S.mo=(S.mo||0)+Number(el.dataset.d||0); render(); return; }
  if(act==="rename"){
    const nn=prompt("改成什么名字？", kidName(S.child));
    if(nn===null) return;
    const t=nn.trim().slice(0,8);
    if(!t) return;
    DB[S.child].alias=t; save(); render(); toast("已改名：" + t); return;
  }
  if(act==="theme"){ cycleTheme(); return; }
  if(act==="theme-set"){ applyTheme(el.dataset.k); render(); return; }
  if(act==="plan-tick"){
    const p=planOf(today()); p[el.dataset.k]=!p[el.dataset.k]; save();
    if(BLOCKS.every(b=>p[b.k])) toast("今天 45 分钟做完了，记得点打卡");
    render(); return;
  }
  if(act==="nce-play"){
    const {item}=nceCur();
    item.e.forEach((x,i)=>{ setTimeout(()=>say(x,0.85), i*2600); });
    NQ.plays++;
    if(NQ.plays>=3){ nqNext("耳朵这一关过了"); } else { render(); }
    return;
  }
  if(act==="nce-hide"){ NQ.hide=!NQ.hide; render(); return; }
  if(act==="nce-ans"){
    const v=el.dataset.v, q=NQ.quiz||{right:""};
    if(v===q.right){ nqNext("读懂了"); }
    else { NQ.msg="不对。再听一遍这句话，看哪个中文对得上。"; render(); }
    return;
  }
  if(act==="nce-rec"){
    const asr=el.dataset.asr==="1", step=NQ.step;
    const {item, ln, book}=nceCur();
    startRec({module:"nce", note:"Lesson "+ln+" · 第"+(step+1)+"步", asr:asr,
      onDone:(sec, score)=>{
        NQ.sec=sec;
        if(step===1){
          if(sec<3){ NQ.msg="只录到 "+sec+" 秒，太短了。跟着念 1～2 遍，至少 3 秒。"; }
          else { nqNext("跟读完成（"+sec+" 秒）"); return; }
        } else if(step===3){
          const target=(item.e[1]||item.e[0]);
          const hr=hitRate(target, score);
          if(sec<4){ NQ.msg="只录到 "+sec+" 秒，太短。把整句背完再停。"; }
          else if(hr!==null && hr<0.5){ NQ.msg="听到的词只有 "+Math.round(hr*100)+"%，再背一遍——慢一点，一个词一个词说清楚。"; }
          else if(hr!==null){ nqNext("背对了（识别到 "+Math.round(hr*100)+"% 的词）"); return; }
          else { nqNext("背了 "+sec+" 秒（这台设备没有语音识别，按时长算过）"); return; }
        } else if(step===4){
          if(sec<5){ NQ.msg="只录到 "+sec+" 秒。用自己的话说 2 句，至少 5 秒。"; }
          else { nqNext("用出来了，五步走完"); return; }
        }
        render();
      }});
    return;
  }
  if(act==="nce-stop-rec"){ stopRec(); return; }
  if(act==="nce-restart"){ nqReset(); render(); return; }
  if(act==="nce-book"){
    const n=nceDone(); const b=el.dataset.b;
    n.lesson=b+"-1"; if(b!==nceCur().book){ n.days=0; n.daySteps=[]; }
    save(); render(); return;
  }
  if(act==="nce-step"){
    const n=nceDone(), i=Number(el.dataset.i);
    const k=n.daySteps.indexOf(i);
    if(k>=0) n.daySteps.splice(k,1); else n.daySteps.push(i);
    save(); render(); return;
  }
  if(act==="nce-day"){
    const n=nceDone();
    if(NQ.step<5){ toast("五步还没走完，先做完再记这一天"); return; }
    n.days=Math.min(5, n.days+1);
    n.daySteps=[]; nqReset();
    if(n.days>=5){
      n.history[n.lesson]=(n.history[n.lesson]||0)+1;
      const {book, ln}=nceCur();
      const b=NCE[book];
      const idx=b.items.findIndex(x=>x.n===ln);
      const nx=b.items[idx+1] || b.items.find(x=>!(n.history[book+"-"+x.n]));
      if(nx){
        n.lesson=book+"-"+nx.n; n.days=0;
        toast("这一课过关了！换下一课：Lesson "+nx.n);
        if(nx.n<=ln) toast("这一册练完了，可以换第二册");
      } else {
        toast("这一册练完了，换第二册或回头复述一遍");
      }
    } else {
      toast("记下第 "+n.days+" 天，明天接着练这一课");
    }
    save(); render(); return;
  }
  if(act==="nce-prev"||act==="nce-next"){
    const n=nceDone(); const {book, ln, b}=nceCur();
    const idx=b.items.findIndex(x=>x.n===ln);
    const d=el.dataset.act==="nce-next"?1:-1;
    const t=b.items[idx+d];
    if(!t){ toast(d>0?"这一册到最后一课了":"已经是第一课"); return; }
    n.lesson=book+"-"+t.n; n.days=0; n.daySteps=[]; save(); render(); return;
  }
  if(act==="nce-pick"){
    const n=nceDone();
    if(n.lesson===el.dataset.k){ toast("已经在练这一课"); return; }
    n.lesson=el.dataset.k; n.days=0; n.daySteps=[]; save(); render(); return;
  }
  if(act==="talk-prev"||act==="talk-next"){
    const c=cur(); const d=el.dataset.act==="talk-next"?1:-1;
    c.talk=((talkIdx()+d)%TALK.length+TALK.length)%TALK.length; save(); render(); return;
  }
  if(act==="sp-ok"){
    const i=Number(el.dataset.i), s0=sessionOf(today());
    const ps=(s0.ps||[]).slice();
    const k=ps.indexOf(i);
    if(k>=0){ ps.splice(k,1); patchSession(today(),S.child,{ps}); }
    else { ps.push(i); patchSession(today(),S.child,{ps}); bump("sp"); }
    render(); return;
  }
  if(act==="topic-next"){ const c=cur(); c.topic=(ti()+1)%TOPICS.length; save(); render(); return; }
  if(act==="topic-prev"){ const c=cur(); c.topic=(ti()-1+TOPICS.length)%TOPICS.length; save(); render(); return; }
  if(act==="tm-start"){ tmStart(+el.dataset.min, el.dataset.k||"小测"); return; }
  if(act==="tm-stop"){ tmStop(); return; }
  if(act==="test-save"){
    const box=document.getElementById("testScore");
    const sc=(box&&box.value||"").trim();
    if(!sc){ toast("先填这次的分数"); return; }
    DB.A.tests=DB.A.tests||[];
    DB.A.tests.push({d:today(), k:TM.type||"小测", min:Math.round((TM.last||0)/60), sc});
    save(); toast("已记录"); render(); return;
  }

  if(act==="screen-start"){
    const list=buildScreen();
    if(!list.length){ toast("这个词范围内的词都学过了，换个范围再摸"); return; }
    SCR={list:list,i:0,cur:list[0],phase:"run",stat:{yes:0,no:0}};
    render(); return;
  }
  if(act==="screen-yes"){ screenAnswer(true); return; }
  if(act==="screen-no"){ screenAnswer(false); return; }
  if(act==="drill-why"){ drillWhy(el.dataset.w); render(); return; }
  if(act==="quiz-start"){ startQuiz(); render(); return; }
  if(act==="ans"){ answer(el.dataset.val); return; }
  if(act==="check-spell"){ checkSpell(); return; }
  if(act==="next-q"){
    Q.i++;
    if(Q.i>=Q.list.length){ Q.phase="done"; } else { nextQ(); return; }
    render(); return;
  }
  if(act==="listen-start"){
    const list=buildListen();
    LQ={list:list,i:0,cur:list[0]||null,phase:list.length?"q":"done",answered:false,stat:{ok:0,bad:0}};
    if(LQ.cur) setTimeout(()=>say(LQ.cur.e,0.78),200);
    render(); return;
  }
  if(act==="check-dictate"){ checkDictate(); return; }
  if(act==="next-l"){
    LQ.i++;
    if(LQ.i>=LQ.list.length){ LQ.phase="done"; }
    else { LQ.cur=LQ.list[LQ.i]; LQ.answered=false; setTimeout(()=>say(LQ.cur.e,0.78),200); }
    render(); return;
  }
  if(act==="write-start"){
    WQ={list:buildWrite(),i:0,cur:null,phase:"q",stat:{ok:0,bad:0}};
    if(!WQ.list.length){ toast("今天还没有学新词，先去单词页练一轮"); WQ.phase="done"; }
    else { WQ.cur=WQ.list[0]; }
    render(); return;
  }
  if(act==="check-write"){ checkWrite(); return; }
  if(act==="next-w"){
    WQ.i++;
    if(WQ.i>=WQ.list.length){ WQ.phase="done"; }
    else { WQ.cur=WQ.list[WQ.i]; WQ.answered=false; }
    render(); return;
  }
  if(act==="save-note"){
    const box=document.getElementById("noteInput");
    const t=(box&&box.value||"").trim();
    if(!t){ toast("先写一句再存"); return; }
    const c=cur(); c.notes=c.notes||[]; c.notes.push({d:today(),t}); save();
    bump("wr");
    toast("已存进造句本"); render(); return;
  }
  if(act==="checkin"){
    patchSession(today(), S.child, {done:true});
    toast("打卡成功，连续 "+streakOf(S.child)+" 天");
    render(); return;
  }
  if(act==="backup"){
    const blob=new Blob([JSON.stringify({v:2, at:today(), data:DB},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="英语学习台备份_"+today()+".json"; a.click();
    try{ localStorage.setItem("eng_last_backup", today()); }catch(err){}
    toast("已导出到「下载」文件夹，可自己挪到别处");
    if(S.view==="today"||S.view==="board") render();
    return;
  }
  if(act==="import"){
    const f=document.getElementById("impFile");
    if(f) f.click(); else toast("先打开看板页再试");
    return;
  }
  if(act==="start-rec"){
    const mod=el.dataset.mod;
    const note = mod==="read" ? TEXTS[S.child][RQ.idx%TEXTS[S.child].length].t
               : mod==="topic" ? ("话题 · "+TOPICS[ti()%TOPICS.length].t)
               : (curScene().n+" · "+curScene().a);
    startRec({module:mod, note}); return;
  }
  if(act==="stop-rec"){ stopRec(); return; }
  if(act==="play"){
    const id=+el.dataset.id;
    try{
      const all=await listRec(S.child);
      const r=all.find(x=>x.id===id);
      if(!r||!r.blob){ toast("这段录音读不出来"); return; }
      const au=new Audio(URL.createObjectURL(r.blob));
      au.play();
    }catch(err){ toast("播放失败"); }
    return;
  }
  if(act==="del-rec"){
    if(!confirm("删除这条录音？")) return;
    await delRec(+el.dataset.id); toast("已删除"); render(); return;
  }
  if(act==="stars"){
    const id=+el.dataset.id;
    const cur0=el.textContent.trim();
    let n=0; for(const ch of el.textContent) if(ch==="★") n++;
    n = n>=5? 0 : n+1;
    await setStars(id, n);
    if(S.view==="plan") paintRecList("topic");
    else if(S.view==="speak") paintRecList(["speak","retell"]);
    else paintRecList(S.view);
    return;
  }
});

/* ==================== 模板（换肤） ==================== */
const THEMES=[
 {k:"blue", n:"清爽蓝",   c:["#0F6FB8","#0E9F6E","#F3F6F9"]},
 {k:"cream",n:"奶油暖阳", c:["#B45309","#F59E0B","#FBF3E4"]},
 {k:"mint", n:"薄荷儿童", c:["#0E7C66","#2FD1A8","#EDF9F4"]},
 {k:"night",n:"夜间护眼", c:["#14263A","#4CA6FF","#0F151C"]}
];
function getTheme(){ return document.body.getAttribute("data-theme")||"blue"; }
function applyTheme(k){
  if(k==="blue") document.body.removeAttribute("data-theme");
  else document.body.setAttribute("data-theme", k);
  try{ localStorage.setItem("eng_theme", k); }catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", k==="night"?"#14263A":k==="cream"?"#D97706":k==="mint"?"#0E9F6E":"#0F6FB8");
}
function cycleTheme(){
  const cur=getTheme(), i=THEMES.findIndex(x=>x.k===cur);
  const nx=THEMES[(i+1)%THEMES.length];
  applyTheme(nx.k); toast("已换成「"+nx.n+"」");
  if(S.view==="board") render();
}


/* 兜底：托管层若在渲染后再插入角标，持续清掉 */
(function hidePlatformMark(){
  const kill=()=>{
    try{
      document.querySelectorAll('[data-custom-element^="doubao-watermark"]').forEach(el=>{
        el.style.setProperty("display","none","important");
        el.style.setProperty("visibility","hidden","important");
      });
    }catch(e){}
  };
  kill();
  setInterval(kill, 1200);
  try{ if(typeof MutationObserver!=="undefined"){ new MutationObserver(kill).observe(document.body,{childList:true,subtree:true}); } }catch(e){}
})();
/* ==================== 启动 ==================== */
(function(){ try{ const t=localStorage.getItem("eng_theme"); if(t) applyTheme(t); }catch(e){} })();
render();
// 首次提示
setTimeout(()=>{ if(!DB[S.child].sess[today()]) toast("先点「开始单词」，做完三件事再打卡"); }, 1600);
</script>
